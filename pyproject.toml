[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "links-manga-workspace"
version = "0.6.0"
description = "Offline manga translation and typesetting workspace"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["PySide6-Essentials>=6.7,<7", "pypdfium2>=4.30,<6", "rapidocr>=3.9,<4", "onnxruntime>=1.20,<2", "python-docx>=1.2,<2", "fonttools>=4.50,<5"]

[project.optional-dependencies]
imaging = ["opencv-python-headless>=4.9"]
test = ["pytest>=8", "pytest-qt>=4.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
