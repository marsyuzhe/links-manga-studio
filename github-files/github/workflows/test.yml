name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test,imaging]"
      - name: Run core and bundled-model tests
        run: python -m pytest -q --ignore=tests/test_full_workflow.py
